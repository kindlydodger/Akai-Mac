<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPC Live // Mac Studio Mirror</title>
<style>
  :root {
    --bg: #111215;
    --panel: #191b20;
    --panel-2: #22252c;
    --border: #2e323c;
    --text: #e6e8ec;
    --muted: #8b92a0;
    --akai-red: #ff3b30;
    --akai-amber: #ff9f0a;
    --akai-green: #30d158;
    --akai-blue: #0a84ff;
    --pad-idle: #262932;
    --pad-glow: #ff453a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 12px; user-select: none; overflow-x: hidden;
  }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* Header */
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: #141519; border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: 0.08em; font-size: 13px; color: #fff; }
  .brand span { color: var(--akai-red); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .dot.ok { background: var(--akai-green); box-shadow: 0 0 8px rgba(48, 209, 88, 0.7); }
  .dot.err { background: var(--akai-red); }
  .spacer { flex: 1; }
  .toggle-lbl { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
  .btn-sm {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-weight: 600;
  }
  .btn-sm:hover { border-color: #555c6e; background: #2a2e37; }
  .btn-sm.active { background: #1d3b66; border-color: var(--akai-blue); color: #fff; }

  /* Workspace Grid */
  .workspace {
    flex: 1; display: grid; grid-template-columns: minmax(480px, 1.35fr) minmax(380px, 1fr);
    gap: 12px; padding: 12px; align-items: start;
  }
  @media (max-width: 1060px) {
    .workspace { grid-template-columns: 1fr; }
  }

  /* Left Screen Chassis */
  .screen-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 10px;
  }
  .bezel {
    background: #08080a; border: 2px solid #2b2f38; border-radius: 8px;
    aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  #mpcScreen {
    width: 100%; height: 100%; object-fit: contain; touch-action: none;
    cursor: crosshair; display: block;
  }
  .macro-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding-top: 6px; border-top: 1px solid var(--border);
  }
  .macro-bar select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px; font-size: 11px;
  }
  .btn-danger {
    background: #3a191b; color: #ffb4b0; border: 1px solid #6b292d;
    border-radius: 5px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .btn-danger:hover { background: #522023; }
  .btn-accent {
    background: #173a25; color: #8ff0ab; border: 1px solid #266b41;
    border-radius: 5px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .btn-accent:hover { background: #1e4d31; }

  /* Right Hardware Panel */
  .hw-panel {
    display: flex; flex-direction: column; gap: 10px;
  }
  .section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .sec-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); display: flex; justify-content: space-between; align-items: center;
  }
  .btn-grid {
    display: grid; gap: 5px; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  }
  .hw-btn {
    background: var(--panel-2); color: #d7dce4; border: 1px solid var(--border);
    border-radius: 5px; padding: 7px 4px; font-size: 10.5px; font-weight: 600;
    cursor: pointer; text-align: center; transition: transform 0.05s, background 0.1s;
    touch-action: manipulation;
  }
  .hw-btn:hover { background: #2c303a; border-color: #495062; }
  .hw-btn:active, .hw-btn.pressed { transform: scale(0.96); background: #3b4252; border-color: #7b849b; }
  .hw-btn.play { border-color: #2c6f3e; color: #7ef29d; }
  .hw-btn.rec { border-color: #7c2828; color: #ff8e88; }
  .hw-btn.overdub { border-color: #7d4e16; color: #ffc166; }
  .hw-btn.latched { background: #6b2421; border-color: var(--akai-red); color: #fff; }
  .hw-btn.bank-on { background: #4a2a12; border-color: var(--akai-amber); color: #ffd48a; }

  /* Dial & Nav row */
  .dial-nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .btn-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

  /* Pads 4x4 */
  .pad-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .vel-wrap { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; margin-left: auto; }
  .pad-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .pad {
    aspect-ratio: 1.25 / 1; background: var(--pad-idle); border: 2px solid #3c414f;
    border-bottom: 4px solid #2b2f3a; border-radius: 7px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px;
    color: #9ba3b4; font-weight: 700; font-size: 11px; transition: box-shadow 0.07s, border-color 0.07s;
    touch-action: manipulation;
  }
  .pad .kbd { font-size: 9.5px; color: #676e7d; font-weight: 500; align-self: flex-end; }
  .pad:hover { border-color: #5c6377; }
  .pad.hit {
    background: #3b2022; border-color: var(--pad-glow); color: #fff;
    box-shadow: inset 0 0 14px rgba(255, 69, 58, 0.55), 0 0 12px rgba(255, 69, 58, 0.35);
  }

  /* Q-Links */
  .qlink-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .qcard {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .qcard strong { font-size: 11px; color: #ddd; }
  .qcard small { color: var(--muted); font-size: 10px; display: block; }

  .footer {
    padding: 6px 14px; background: #141519; border-top: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 10px;
  }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">AKAI <span>MPC LIVE</span> // STUDIO MIRROR</div>
    <span class="pill"><i class="dot" id="dotBridge"></i><span id="txtBridge">Bridge :6731 ...</span></span>
    <span class="pill"><i class="dot" id="dotScreen"></i><span id="txtScreen">Screen :6720 ...</span></span>
    <div class="spacer"></div>
    <label class="toggle-lbl"><input type="checkbox" id="chkHalf"> Half Res (Fast Wi-Fi)</label>
    <button class="btn-sm active" id="btnKbd">Keyboard Play: ON</button>
    <button class="btn-sm" id="btnReloadStream">Reload Stream</button>
  </header>

  <main class="workspace">
    <!-- Live Touchscreen + Quick Macros -->
    <section class="screen-card">
      <div class="bezel">
        <img id="mpcScreen" alt="MPC Live Stream" draggable="false">
      </div>
      <div class="macro-bar">
        <button class="btn-sm" onclick="runMacro('open_browser')">Open [okcomputer] Browser</button>
        <button class="btn-danger" onclick="clearEventsConfirm()">Clear Seq Events</button>
        <div class="spacer"></div>
        <select id="presetSelect"></select>
        <button class="btn-accent" onclick="deployPreset()">Build &amp; Deploy .mid</button>
      </div>
    </section>

    <!-- Hardware Surface -->
    <section class="hw-panel">
      <!-- Transport & Navigation -->
      <div class="section">
        <div class="sec-title"><span>Transport &amp; Modes</span><span>Space = Play Start | Esc = Stop</span></div>
        <div class="btn-grid">
          <button class="hw-btn" onclick="pressBtn('STOP')">STOP</button>
          <button class="hw-btn play" onclick="pressBtn('PLAY')">PLAY</button>
          <button class="hw-btn play" onclick="pressBtn('PLAY_START')">PLAY START</button>
          <button class="hw-btn overdub" onclick="pressBtn('OVERDUB')">OVERDUB</button>
          <button class="hw-btn rec" onclick="pressBtn('REC')">REC</button>
          <button class="hw-btn" onclick="pressBtn('TAP_TEMPO')">TAP</button>

          <button class="hw-btn" onclick="pressBtn('MAIN')">MAIN</button>
          <button class="hw-btn" onclick="pressBtn('MENU')">MENU</button>
          <button class="hw-btn" onclick="pressBtn('STEP_SEQ')">STEP SEQ</button>
          <button class="hw-btn" onclick="pressBtn('TRACK_MUTE')">PAD MUTE</button>
          <button class="hw-btn" onclick="pressBtn('NEXT_SEQ')">NEXT SEQ</button>
          <button class="hw-btn" onclick="pressBtn('PROGRAM_EDIT')">PROG EDIT</button>
          <button class="hw-btn" onclick="pressBtn('TRACK_MIXER')">TRK MIX</button>
          <button class="hw-btn" onclick="pressBtn('PAD_MIXER')">PAD MIX</button>
          <button class="hw-btn" onclick="pressBtn('SAMPLE_EDIT')">SMP EDIT</button>
          <button class="hw-btn" onclick="pressBtn('SAMPLE_EDIT_CHOP')">CHOP</button>
          <button class="hw-btn" onclick="pressBtn('XYFX')">XYFX</button>
          <button class="hw-btn" onclick="pressBtn('UNDO')">UNDO</button>
          <button class="hw-btn" onclick="pressBtn('REDO')">REDO</button>
          <button class="hw-btn" onclick="pressBtn('COPY')">COPY</button>
          <button class="hw-btn" onclick="pressBtn('ERASE')">ERASE</button>
          <button class="hw-btn" onclick="pressBtn('MUTE')">MUTE</button>
          <button class="hw-btn" onclick="pressBtn('SOLO')">SOLO</button>
          <button class="hw-btn" onclick="pressBtn('REC_ARM')">REC ARM</button>
        </div>

        <div class="dial-nav">
          <div class="btn-row">
            <button class="hw-btn" onclick="turnDial(-5)">&#9664;&#9664;</button>
            <button class="hw-btn" onclick="turnDial(-1)">&#9664; Dial</button>
            <button class="hw-btn" onclick="turnDial(0, true)">PUSH</button>
            <button class="hw-btn" onclick="turnDial(1)">Dial &#9654;</button>
            <button class="hw-btn" onclick="turnDial(5)">&#9654;&#9654;</button>
          </div>
          <div class="btn-row">
            <button class="hw-btn" onclick="pressBtn('MINUS')">-</button>
            <button class="hw-btn" onclick="pressBtn('PLUS')">+</button>
            <button class="hw-btn" onclick="pressBtn('LEFT')">&#8592;</button>
            <button class="hw-btn" onclick="pressBtn('UP')">&#8593;</button>
            <button class="hw-btn" onclick="pressBtn('DOWN')">&#8595;</button>
            <button class="hw-btn" onclick="pressBtn('RIGHT')">&#8594;</button>
          </div>
        </div>
      </div>

      <!-- Pads & Banks -->
      <div class="section">
        <div class="sec-title"><span>16 Velocity Pads</span><span id="bankLabel">Bank A</span></div>
        <div class="pad-controls">
          <button class="hw-btn" id="btnShift" onclick="toggleShift()">SHIFT</button>
          <button class="hw-btn bank-on" id="bankA" onclick="selectBank('A')">A / E</button>
          <button class="hw-btn" id="bankB" onclick="selectBank('B')">B / F</button>
          <button class="hw-btn" id="bankC" onclick="selectBank('C')">C / G</button>
          <button class="hw-btn" id="bankD" onclick="selectBank('D')">D / H</button>
          <button class="hw-btn" onclick="pressBtn('FULL_LEVEL')">FULL LVL</button>
          <button class="hw-btn" onclick="pressBtn('16_LEVEL')">16 LVL</button>
          <button class="hw-btn" onclick="pressBtn('NOTE_REPEAT')">NOTE RPT</button>
          <div class="vel-wrap">
            <span>Vel</span>
            <input type="range" id="velSlider" min="1" max="127" value="112" style="width:82px">
            <strong id="velVal">112</strong>
          </div>
        </div>
        <div class="pad-grid" id="padGrid"></div>
      </div>

      <!-- Q-Links -->
      <div class="section">
        <div class="sec-title">
          <span>Q-Link Controls</span>
          <span class="btn-row">
            <button class="btn-sm" onclick="pressBtn('QLINK_MODE_1')">M1</button>
            <button class="btn-sm" onclick="pressBtn('QLINK_MODE_2')">M2</button>
            <button class="btn-sm" onclick="pressBtn('QLINK_MODE_3')">M3</button>
            <button class="btn-sm" onclick="pressBtn('QLINK_MODE_4')">M4</button>
          </span>
        </div>
        <div class="qlink-grid" id="qlinkGrid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="logLine">Ready.</span>
    <span>Touch passthrough -&gt; :6720 | HW bridge -&gt; :6731</span>
  </footer>
</div>

<script>
const screenEl = document.getElementById('mpcScreen');
const chkHalf = document.getElementById('chkHalf');
const velSlider = document.getElementById('velSlider');
const velVal = document.getElementById('velVal');
const btnKbd = document.getElementById('btnKbd');
const btnShift = document.getElementById('btnShift');

let screenW = 1280, screenH = 800;
let shiftLatched = false;
let kbdEnabled = true;

function setLog(msg, isErr) {
  const el = document.getElementById('logLine');
  el.textContent = msg;
  el.style.color = isErr ? '#ff8e88' : '#9ee5b4';
}

function loadStream() {
  screenEl.src = '/stream?half=' + (chkHalf.checked ? '1' : '0') + '&t=' + Date.now();
}
chkHalf.onchange = loadStream;
document.getElementById('btnReloadStream').onclick = loadStream;
screenEl.onerror = () => setTimeout(loadStream, 1500);

// Touchscreen live pointer forwarding (tap + smooth drag)
function screenParams(e) {
  const r = screenEl.getBoundingClientRect();
  const x = Math.max(0, Math.min(screenW - 1, Math.round((e.clientX - r.left) / r.width * screenW)));
  const y = Math.max(0, Math.min(screenH - 1, Math.round((e.clientY - r.top) / r.height * screenH)));
  return `?x=${x}&y=${y}`;
}
let ptrDown = false, lastMove = 0;
screenEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  ptrDown = true;
  try { screenEl.setPointerCapture(e.pointerId); } catch (_) {}
  fetch('/down' + screenParams(e));
});
screenEl.addEventListener('pointermove', e => {
  if (!ptrDown) return;
  const now = Date.now();
  if (now - lastMove < 40) return;
  lastMove = now;
  fetch('/move' + screenParams(e));
});
function endTouch() {
  if (!ptrDown) return;
  ptrDown = false;
  fetch('/up');
}
screenEl.addEventListener('pointerup', endTouch);
screenEl.addEventListener('pointercancel', endTouch);

async function postApi(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok || !data.ok) {
    throw new Error(data.error || ('HTTP ' + res.status));
  }
  return data;
}

async function pressBtn(name) {
  try {
    if (shiftLatched && name !== 'SHIFT') {
      const data = await postApi('/api/combo', {modifier: 'SHIFT', target: name});
      setLog(`SHIFT + ${data.target}`);
      return;
    }
    const data = await postApi('/api/button', {name});
    setLog(`Button ${data.button} (0x${Number(data.note || 0).toString(16).toUpperCase()})`);
  } catch (e) {
    setLog(e.message, true);
  }
}

function toggleShift() {
  shiftLatched = !shiftLatched;
  btnShift.classList.toggle('latched', shiftLatched);
  setLog(shiftLatched ? 'SHIFT latched (next tap/bank sends SHIFT combo)' : 'SHIFT unlatched');
}

async function selectBank(base) {
  const mapShift = {A: 'E', B: 'F', C: 'G', D: 'H'};
  const bank = shiftLatched ? mapShift[base] : base;
  try {
    if (shiftLatched) {
      await postApi('/api/combo', {modifier: 'SHIFT', target: 'BANK_' + base});
      shiftLatched = false;
      btnShift.classList.remove('latched');
    } else {
      await postApi('/api/button', {name: 'BANK_' + base});
    }
    ['A', 'B', 'C', 'D'].forEach(b => document.getElementById('bank' + b).classList.toggle('bank-on', b === base));
    document.getElementById('bankLabel').textContent = 'Bank ' + bank;
    setLog('Switched to Pad Bank ' + bank);
  } catch (e) {
    setLog(e.message, true);
  }
}

async function turnDial(steps, press = false) {
  try {
    await postApi('/api/dial', {steps, press});
    setLog(press ? `Dial push (steps=${steps})` : `Dial ${steps > 0 ? '+' : ''}${steps}`);
  } catch (e) {
    setLog(e.message, true);
  }
}

// Physical 4x4 layout: Row 4 (13..16) top -> Row 1 (1..4) bottom
const PAD_ORDER = [
  [13, '1'], [14, '2'], [15, '3'], [16, '4'],
  [9,  'Q'], [10, 'W'], [11, 'E'], [12, 'R'],
  [5,  'A'], [6,  'S'], [7,  'D'], [8,  'F'],
  [1,  'Z'], [2,  'X'], [3,  'C'], [4,  'V'],
];
const KEY_TO_PAD = {};
const padElByNum = {};

function buildPads() {
  const grid = document.getElementById('padGrid');
  grid.innerHTML = '';
  for (const [num, key] of PAD_ORDER) {
    KEY_TO_PAD[key.toLowerCase()] = num;
    const btn = document.createElement('button');
    btn.className = 'pad';
    btn.innerHTML = `<span>PAD ${String(num).padStart(2, '0')}</span><span class="kbd">${key}</span>`;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      hitPad(num);
    });
    grid.appendChild(btn);
    padElByNum[num] = btn;
  }
}

async function hitPad(num) {
  const el = padElByNum[num];
  if (el) {
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 140);
  }
  const vel = Number(velSlider.value || 110);
  try {
    const res = await postApi('/api/pad', {pad: num, velocity: vel, duration_ms: 85});
    setLog(`Pad ${num} triggered (vel=${res.velocity})`);
  } catch (e) {
    setLog(e.message, true);
  }
}

velSlider.oninput = () => { velVal.textContent = velSlider.value; };

btnKbd.onclick = () => {
  kbdEnabled = !kbdEnabled;
  btnKbd.classList.toggle('active', kbdEnabled);
  btnKbd.textContent = kbdEnabled ? 'Keyboard Play: ON' : 'Keyboard Play: OFF';
};

window.addEventListener('keydown', e => {
  if (!kbdEnabled || e.repeat) return;
  if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space') {
    e.preventDefault();
    pressBtn('PLAY_START');
    return;
  }
  if (e.code === 'Escape') {
    e.preventDefault();
    pressBtn('STOP');
    return;
  }
  const pad = KEY_TO_PAD[e.key.toLowerCase()];
  if (pad) {
    e.preventDefault();
    hitPad(pad);
  }
});

function renderQlinks(qlinks, learned) {
  const box = document.getElementById('qlinkGrid');
  box.innerHTML = '';
  for (let k = 1; k <= 4; k++) {
    const cfg = (qlinks && qlinks[String(k)]) || {};
    const lcfg = (learned && learned['QLINK_' + k]) || {};
    const cc = cfg.cc != null ? cfg.cc : lcfg.cc;
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div><strong>Q-Link ${k}</strong><small>${cc != null ? ('CC ' + cc) : 'Unmapped'}</small></div>
      <div class="btn-row">
        <button class="btn-sm" onclick="turnQ(${k}, -3)">-</button>
        <button class="btn-sm" onclick="turnQ(${k}, 3)">+</button>
        <button class="btn-sm" onclick="learnQ(${k})">Learn</button>
      </div>`;
    box.appendChild(card);
  }
}

async function turnQ(knob, delta) {
  try {
    await postApi('/api/qlink', {knob, delta});
    setLog(`Q-Link ${knob} (${delta > 0 ? '+' : ''}${delta})`);
  } catch (e) {
    setLog(e.message, true);
  }
}

async function learnQ(knob) {
  setLog(`Turn physical Q-Link ${knob} on MPC within 10s...`);
  try {
    const res = await postApi('/api/learn', {name: 'QLINK_' + knob, timeout_s: 10});
    setLog(`Learned QLINK_${knob}: ${JSON.stringify(res.saved_entry)}`);
    refreshStatus();
  } catch (e) {
    setLog(e.message, true);
  }
}

async function runMacro(action) {
  setLog(`Running macro: ${action}...`);
  try {
    await postApi('/api/macro', {action});
    setLog(`Macro '${action}' completed.`);
  } catch (e) {
    setLog(e.message, true);
  }
}

function clearEventsConfirm() {
  if (confirm('Clear all MIDI events in active Sequence 01?')) {
    runMacro('clear_events');
  }
}

async function deployPreset() {
  const preset = document.getElementById('presetSelect').value;
  setLog(`Building & deploying ${preset}.mid to MPC...`);
  try {
    const res = await postApi('/api/midi/deploy', {preset, deploy: true});
    setLog(`Deployed ${res.remote_path} (${res.midi.note_count} notes, ${res.midi.bpm} BPM)`);
  } catch (e) {
    setLog(e.message, true);
  }
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const okB = data.ok && data.bridge && data.bridge.ready;
    document.getElementById('dotBridge').className = 'dot ' + (okB ? 'ok' : 'err');
    document.getElementById('txtBridge').textContent = okB
      ? `Bridge OK (tx=${data.bridge.tx_inj}, rx=${data.bridge.rx_pkts})`
      : 'Bridge Offline';

    const sc = data.screen || {};
    const okS = Boolean(sc.width);
    if (sc.width) { screenW = sc.width; screenH = sc.height; }
    document.getElementById('dotScreen').className = 'dot ' + (okS ? 'ok' : 'err');
    document.getElementById('txtScreen').textContent = okS ? `${sc.width}x${sc.height} Live` : 'Screen Offline';

    renderQlinks(data.qlinks, data.learned);

    const sel = document.getElementById('presetSelect');
    if (!sel.options.length && Array.isArray(data.presets)) {
      data.presets.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });
    }
  } catch (e) {
    document.getElementById('dotBridge').className = 'dot err';
    document.getElementById('dotScreen').className = 'dot err';
  }
}

buildPads();
loadStream();
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
